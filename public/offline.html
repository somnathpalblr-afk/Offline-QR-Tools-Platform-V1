<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4956104307611686" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ScanProGo – Offline</title>
    <script src="/theme.js"></script>
    <link rel="icon" href="/favicon.png" />
    <style>
      [data-theme="dark"] { --bg: #0b1425; --fg: #edf3ff; --card: #152238; --border: #354b68; }
      body {
        font-family: system-ui;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg, #fff);
        color: var(--fg, #07132f);
      }
      .card {
        max-width: 440px;
        margin: 24px;
        padding: 36px;
        background: var(--card, #f8fafc);
        border: 1px solid var(--border, #dce6f4);
        border-radius: 18px;
        text-align: center;
      }
      a {
        display: inline-block;
        margin-top: 15px;
        padding: 12px 18px;
        background: #0969f6;
        color: #fff;
        border-radius: 9px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/brand/scanprogo-logo.png" width="280" style="max-width:100%;height:auto;background:white;border-radius:8px" alt="ScanProGo — Scan • Generate • Go" />
      <h1>You’re offline</h1>
      <p>
        ScanProGo works offline after the application has been installed and cached. Return to the
        app to use available local tools.
      </p>
      <a href="/">Open ScanProGo</a>
    </main>
  </body>
</html>
