<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QR Tools – Offline</title>
    <style>
      body {
        font-family: system-ui;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f8ff;
        color: #07132f;
      }
      .card {
        max-width: 440px;
        margin: 24px;
        padding: 36px;
        background: #fff;
        border: 1px solid #dce6f4;
        border-radius: 18px;
        text-align: center;
      }
      a {
        display: inline-block;
        margin-top: 15px;
        padding: 12px 18px;
        background: #0969f6;
        color: #fff;
        border-radius: 9px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You’re offline</h1>
      <p>
        QR Tools works offline after the application has been installed and cached. Return to the
        app to use available local tools.
      </p>
      <a href="/">Open QR Tools</a>
    </main>
  </body>
</html>
